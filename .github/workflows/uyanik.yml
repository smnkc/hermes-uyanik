name: hermes-uyanik

on:
  schedule:
    - cron: "*/15 * * * *"   # her 15 dk: makineyi uyanik tut
    - cron: "17 3 1 * *"     # her ayin 1'i: repo keepalive (60 gun kurali)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  wake:
    if: github.event.schedule != '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KEY: ${{ secrets.INSTABOX_API_KEY }}
      IDS: ${{ secrets.INSTABOX_MACHINE_IDS }}
      M1: ${{ secrets.INSTABOX_MACHINE_ID }}
      API: https://api.instabox.sh/v1/machines
    steps:
      - name: Her makine icin durum kontrol, gerekirse baslat, aktivite kaydi
        run: |
          set -u
          list="${IDS:-$M1}"
          if [ -z "$KEY" ] || [ -z "$list" ]; then echo "INSTABOX_API_KEY / INSTABOX_MACHINE_IDS secret eksik"; exit 1; fi
          i=0
          for M in $(echo "$list" | tr ',' ' '); do
            i=$((i+1))
            state=$(curl -s -m 20 "$API/$M" -H "X-API-Key: $KEY" | jq -r '.state // "unknown"')
            echo "makine #$i durum: $state"
            case "$state" in
              suspended|stopped|paused)
                code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" -X POST "$API/$M/start" -H "X-API-Key: $KEY" \
                  -H "Idempotency-Key: gha-start-${GITHUB_RUN_ID}-$i" -H "Content-Type: application/json" -d '{}')
                echo "  start istendi: $code" ;;
              running)
                code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" -X PUT "$API/$M/activity-leases/gha-uyanik" -H "X-API-Key: $KEY" \
                  -H "Content-Type: application/json" -d '{"ttlSeconds":1200}')
                echo "  lease: $code"
                curl -s -m 50 -X POST "$API/$M/wake" -H "X-API-Key: $KEY" -o /dev/null -w "  wake %{http_code}\n" ;;
              *) echo "  islem yok ($state)" ;;
            esac
          done

  keepalive:
    if: github.event.schedule == '17 3 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Zamanlanmis isi aktif tut + aylik commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/uyanik.yml/enable" || true
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u +%Y-%m)" || exit 0
          git push
